# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic is the *single source of truth* for the database schema.
# The ORM models in app/models/models.py define the schema; this file wires
# Alembic to those models so `alembic revision --autogenerate` detects drift,
# and `alembic upgrade head` applies it.
#
# The raw scripts/schema.sql file is kept ONLY as a human-readable reference
# and for the Docker COPY in the initial container build.  It must NOT be
# used to create or alter tables directly — use `alembic upgrade head`.
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Alembic reads DATABASE_URL from the environment (set in env.py).
# The fallback here is only for `alembic` CLI invocations without an .env.
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision file timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
